name: CI

# 오프라인 검증만 수행한다. 학교 서버 요청, 실제 인증, 배포, 비밀 값은 사용하지 않는다.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/tests/_network
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.1"
      - run: uv run --locked --python ${{ matrix.python }} python -m unittest discover -s tests -v

  build:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.1"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  installed-cli:
    name: Installed CLI (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/tests/_network
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.1"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      # 저장소 밖의 격리된 환경에 wheel만 설치해 실행한다. 인증 정보 없이 실행하므로 네트워크 요청 전에 종료되어야 한다.
      - name: Console script and python -m
        working-directory: ${{ runner.temp }}
        run: |
          unset INHA_USERNAME INHA_PASSWORD
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          run() { uv run --no-project --isolated --python "${{ matrix.python }}" --with "$wheel" "$@"; }
          run inha-login-fetcher --version | grep -F "0.4.0"
          run inha-login-fetcher --help > /dev/null
          run python -m inha_cloud --help > /dev/null
          for command in "inha-login-fetcher" "python -m inha_cloud"; do
            code=0
            output=$(run $command --env --json < /dev/null) || code=$?
            test "$code" -eq 2
            printf '%s' "$output" | grep -F '"status": "invalid_input"'
          done
